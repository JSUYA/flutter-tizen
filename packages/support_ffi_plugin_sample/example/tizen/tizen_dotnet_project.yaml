# csproj file path
csproj_file: tizen.csproj

# Default profile, Tizen API version
profile: tizen
api_version: "10.0"

# Build type [Debug/ Release/ Test]
build_type: Debug

# Output path for build
output_path: ""

# Signing profile to be used for Tizen package signing
# If value is empty: "", active signing profile will be used
# Else If value is ".", default signing profile will be used
signing_profile: "platform"

# files monitored for dirty/modified status
files:
  - .app.deps.json
  - .gitignore
  - App.cs
  - Runner.csproj
  - Runner.csproj.user
  - flutter/GeneratedPluginRegistrant.cs
  - flutter/ephemeral/lib/libflutter_engine.so
  - flutter/ephemeral/lib/libflutter_tizen.so
  - flutter/ephemeral/res/flutter_assets/.app.deps.json
  - flutter/ephemeral/res/flutter_assets/AssetManifest.bin
  - flutter/ephemeral/res/flutter_assets/FontManifest.json
  - flutter/ephemeral/res/flutter_assets/NOTICES.Z
  - flutter/ephemeral/res/flutter_assets/isolate_snapshot_data
  - flutter/ephemeral/res/flutter_assets/kernel_blob.bin
  - flutter/ephemeral/res/flutter_assets/shaders/ink_sparkle.frag
  - flutter/ephemeral/res/flutter_assets/shaders/stretch_effect.frag
  - flutter/ephemeral/res/flutter_assets/vm_snapshot_data
  - flutter/ephemeral/res/icudtl.dat
  - flutter/generated_main.dart
  - shared/res/ic_launcher.png
  - tizen-manifest.xml

# project dependencies
deps:
  - .
