name: support_ffi_plugin_sample
description: Minimal FFI-only Tizen plugin sample for flutter-tizen.
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      tizen:
        ffiPlugin: true
