publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_tizen:
    path: ../flutter_tizen
  lottie: ^3.3.3
  video_player: ^2.11.1
